name: Deploy Static Site to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Uprawnienia wymagane do publikacji w GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Zapewnienie jednego współbieżnego wdrożenia
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Ścieżka do katalogu z plikami statycznymi (główny katalog repozytorium)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
